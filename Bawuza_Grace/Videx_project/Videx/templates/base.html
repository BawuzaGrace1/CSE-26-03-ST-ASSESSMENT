{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script>document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Videx{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:var(--bs-tertiary-bg); }
        .brand-btn { border:2px solid #e50914; color:#e50914; font-weight:bold; }
        .brand-btn:hover { background:#e50914; color:#fff; }
        .brand-solid { background:#e50914; color:#fff; font-weight:bold; border:2px solid #e50914; }
        .brand-solid:hover { background:var(--bs-body-bg); color:#e50914; }
        {% block style %}{% endblock %}
    </style>
</head>
<body>
<button id="themeBtn" class="btn btn-sm btn-outline-secondary" style="position:fixed;top:12px;right:12px;z-index:50" title="Toggle dark mode">&#127769;</button>
{% block content %}{% endblock %}
<script>
(function () {
    const btn = document.getElementById('themeBtn');
    const root = document.documentElement;
    const paint = () => btn.innerHTML = root.getAttribute('data-bs-theme') === 'dark' ? '&#9728;&#65039;' : '&#127769;';
    paint();
    btn.addEventListener('click', () => {
        const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
        paint();
    });
})();
</script>
{% block script %}{% endblock %}
</body>
</html>
